[package]
name = "json-skimmer"
version = "1.0.0"
edition = "2024"
rust-version = "1.87"
description = "A recoverable, event-driven streaming JSON parser"
license = "MIT"
repository = "https://github.com/joeledwards/json-skimmer"
readme = "README.md"
keywords = ["json", "parser", "streaming", "incremental"]
categories = ["parser-implementations"]
include = ["src/**", "examples/**", "tools/**", "docs/**", "README.md", "ROADMAP.md", "LICENSE", "rust-toolchain.toml"]

[dependencies]

[dev-dependencies]
json-volcano = { version = "1.0.0", default-features = false }
