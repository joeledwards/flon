[package]
name = "flon"
version = "0.1.0"
edition = "2024"
description = "Stream JSON as flat, grep-friendly assignments"
license = "ISC"
keywords = ["json", "streaming", "flatten", "gron"]
categories = ["command-line-utilities", "encoding"]

[dependencies]
anstream = "1.0"
anstyle = "1.0"
clap = { version = "4.5", features = ["derive"] }
json-skimmer = { version = "0.1.0", path = "../json-skimmer" }
tempfile = "3.23"

[dev-dependencies]
json-volcano = { version = "1.0.0", default-features = false }
